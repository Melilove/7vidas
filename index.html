html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}

.wrap{padding:8px 18px 28px}
button{cursor:pointer;font-family:inherit;color:inherit}

input::placeholder,textarea::placeholder{color:#8FA592}
img{max-width:100%}
.serif{font-family:Fraunces,Georgia,serif}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;color:var(--ink);text-align:left;width:100%}
.h1{margin:0;font-family:Fraunces,Georgia,serif;font-size:28px;font-weight:600;line-height:1.1}
.h2{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--mu)}
.mu{color:var(--mu)}

.row{display:flex;align-items:center;gap:10px}

.acc{background:var(--ac);color:var(--onac);border-color:var(--ac)}

.chip.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}

textarea.in{padding:10px 12px;resize:none;min-height:84px;line-height:1.45}
.lab{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:800;color:var(--mu)}
.err{font-size:13px;color:var(--err);margin:0}
.scr{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.scr::-webkit-scrollbar{display:none}
.wrapchips{display:flex;flex-wrap:wrap;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 12px}
.bub{margin:0;background:var(--sf);border:1px solid var(--ln);border-radius:4px 16px 16px 16px;padding:10px 12px;font-size:14px;line-height:1.45;flex:1}

.nv.on{color:var(--ac)}.nv.on span.pill{background:var(--sf2)}

.shelflbl{display:flex;justify-content:space-between;font-size:11px;color:#C2CDBE;padding:3px 2px 6px}
.zrow{display:flex;align-items:flex-end;gap:5px;height:150px;border-bottom:8px solid #5A4631}
.zb{flex:1;max-width:34px;border:none;border-radius:3px 3px 0 0;color:#F1EADB;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 0 4px;overflow:hidden}

.dot{position:absolute;width:4px;height:4px;border-radius:50%;background:#F1EADB}
.page{animation:pagein .45s ease-out}

.tw{animation:tw 3.4s ease-in-out infinite}
